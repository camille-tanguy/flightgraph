# FlightGraph — Python project configuration

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.coverage.run]
source = ["api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]