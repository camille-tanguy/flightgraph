services:
  neo4j:
    image: neo4j:5.26
    container_name: flightgraph-neo4j

    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in your .env file}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"

    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: