services:
  neo4j:
    image: neo4j:5.26
    container_name: flightgraph-neo4j

    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in your .env file}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"

    volumes:
      - neo4j_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u "$${NEO4J_AUTH%%/*}" -p "$${NEO4J_AUTH#*/}" "RETURN 1" > /dev/null'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flightgraph-api

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in your .env file}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}

    depends_on:
      neo4j:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:stable-alpine
    container_name: flightgraph-nginx

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neo4j_data:
